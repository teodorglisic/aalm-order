<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book-Catalog</title>
</head>
<body>

    <input type="text"/>
    <input type="submit" value="Search">

    <table>
        <thead>
        <tr>
            <th>ISBN</th>
            <th>Author</th>
            <th>Title</th>
            <th>Description</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.isbn()}"></td>
            <td th:text="${book.author()}"></td>
            <td th:text="${book.title()}"></td>
            <td th:text="${book.description()}"></td>
        </tr>
        </tbody>
    </table>

</body>
</html>
